<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe</title>
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#262626;--mu:#8e8e8e;--ln:#dbdbdb;--pri:#0095f6}
body.dark{--bg:#000;--card:#121212;--tx:#f5f5f5;--mu:#a8a8a8;--ln:#262626}
*{box-sizing:border-box}body{margin:0;padding-left:230px;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}a{color:inherit;text-decoration:none}
#nav{position:fixed;left:0;top:0;bottom:0;width:230px;border-right:1px solid var(--ln);padding:20px 12px;background:var(--bg);display:flex;flex-direction:column;gap:4px;z-index:5}
.logo{font-size:28px;font-weight:800;background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 12px 16px}
#nav a,#nav button{display:flex;gap:14px;align-items:center;padding:11px 12px;border-radius:8px;font:inherit;font-size:16px;background:none;border:0;color:var(--tx);cursor:pointer;text-align:left}
#nav a:hover,#nav button:hover,#nav a.on{background:#8881;font-weight:600}
.bd{background:#ff3040;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:auto}.bd:empty{display:none}
#wrap{display:flex;gap:30px;justify-content:center;padding:20px 16px 40px;max-width:1080px;margin:0 auto}main{flex:1;max-width:630px;min-width:0}#wrap.wide main{max-width:900px}
#rs{display:none;width:300px;flex:none;position:sticky;top:20px;align-self:flex-start}@media(min-width:1100px){#rs{display:block}#wrap.wide #rs{display:none}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;margin-bottom:16px;overflow:hidden}.c{padding:30px;text-align:center}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px}.pb{padding:0 12px 12px}.pa{display:flex;padding:4px 8px}
.ic{background:none;border:0;font-size:22px;cursor:pointer;padding:6px;color:var(--tx)}
.pm img,.pm video{width:100%;max-height:640px;object-fit:contain;background:#000;display:block}
.tp{padding:70px 24px;font-size:22px;font-weight:600;color:#fff;text-align:center;word-break:break-word}
.g0{background:linear-gradient(135deg,#f58529,#dd2a7b)}.g1{background:linear-gradient(135deg,#8134af,#515bd4)}.g2{background:linear-gradient(135deg,#00c6ff,#0072ff)}.g3{background:linear-gradient(135deg,#11998e,#38ef7d)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(45deg,#f58529,#dd2a7b);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}.av.sm{width:32px;height:32px;font-size:13px}.av.xl{width:90px;height:90px;font-size:36px}
.m{color:var(--mu)}.err{color:#ed4956}
.ci,.f{width:100%;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 10px;border-radius:6px;font:inherit;margin-top:6px}
button.pri,button.sm{border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}button.sm{padding:5px 12px;background:#8883;color:var(--tx)}button.w{width:100%;margin-top:8px}
.tray{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px}.tu{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer;min-width:68px;position:relative;padding-top:22px}
.ring{padding:3px;border-radius:50%;background:var(--ln)}.ring.new{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}.ring.seen{background:#8886}.ring .av{border:3px solid var(--bg)}
.nb{position:absolute;top:0;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:1px 8px;font-size:11px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg{padding:12px}.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tl{aspect-ratio:1;position:relative;overflow:hidden;display:block;background:#000}.tl img,.tl video{width:100%;height:100%;object-fit:cover}.vb{position:absolute;top:6px;right:8px;color:#fff}
.pf{display:flex;gap:24px;padding:20px;align-items:center;flex-wrap:wrap}.st{display:flex;gap:20px;margin:8px 0}.ur{display:flex;align-items:center;gap:10px;padding:8px 0}
.mb{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:60}.mc{background:var(--card);border-radius:12px;padding:18px;width:min(420px,92vw);max-height:80vh;overflow:auto}
.svw{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}.svw img,.svw video{max-height:100vh;max-width:100vw;object-fit:contain}
.sb{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}.sb i{flex:1;height:3px;background:#fff5;border-radius:2px;overflow:hidden}.sb i.d b{width:100%}.sb b{display:block;height:100%;background:#fff;width:0}
@keyframes fill{to{width:100%}}
.sh{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:8px;color:#fff;z-index:3}
.sn{position:absolute;top:60px;bottom:60px;width:35%;z-index:2;left:0}.sn.r{left:auto;right:0;width:65%}.sf{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:10px}.sf button{background:#fff;color:#000;padding:9px 18px;font-size:15px}
.chat{display:flex;height:75vh;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--card)}.cl{width:250px;border-right:1px solid var(--ln);overflow:auto}.th{flex:1;display:flex;flex-direction:column;min-width:0}
.cv{display:flex;gap:10px;padding:10px 12px;align-items:center;cursor:pointer}.cv:hover,.cv.on{background:#8881}.cv div{min-width:0;flex:1}.cv small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ml{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.b{max-width:75%;padding:7px 10px;border-radius:12px;word-break:break-word}.b.me{align-self:flex-end;background:#d9fdd3;color:#111}.b.ot{align-self:flex-start;background:var(--card);border:1px solid var(--ln)}.b small{display:block;text-align:right;font-size:10px;opacity:.7}.b img,.b video{max-width:100%;border-radius:8px;display:block}.sp{display:block;border-left:3px solid #dd2a7b;padding-left:6px;margin-bottom:4px}
.mi{display:flex;gap:6px;padding:8px;border-top:1px solid var(--ln);align-items:center}.mi .f{margin:0}
#t{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;display:none;z-index:99}
@media(max-width:800px){body{padding:0 0 60px}#nav{top:auto;width:100%;height:56px;flex-direction:row;border-right:0;border-top:1px solid var(--ln);padding:0;justify-content:space-around}.logo,#nav .lab{display:none}#nav a,#nav button{padding:8px;font-size:22px}.chat .cl{width:100%;border:0}.chat.open .cl{display:none}.chat:not(.open) .th{display:none}}
</style>
<nav id="nav"><div class="logo">Vibe</div>
<a href="#/" data-r="/">🏠<span class="lab">Home</span></a><a href="#/search" data-r="/search">🔍<span class="lab">Search</span></a><a href="#/explore" data-r="/explore">🧭<span class="lab">Explore</span></a>
<a href="#/messages" data-r="/messages">💬<span class="lab">Messages</span><span class="bd" id="bm"></span></a><a href="#/notifications" data-r="/notifications">❤️<span class="lab">Notifications</span><span class="bd" id="bn"></span></a>
<a href="#/create" data-r="/create">➕<span class="lab">Create</span></a><a href="#/" id="np">👤<span class="lab">Profile</span></a>
<button onclick="theme()">🌓<span class="lab">Theme</span></button><button onclick="logout()">🚪<span class="lab">Log out</span></button></nav>
<div id="wrap"><main id="v"></main><aside id="rs"></aside></div><div id="sv"></div><div id="md"></div><div id="t"></div><input type="file" id="sf" accept="image/*,video/*" hidden onchange="addStory(this)">
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.t||'',me=null,es=null,TR=[],sv={},cur={};
const api=(p,m='GET',b)=>fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b&&JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({error:'Request failed'}));if(!r.ok)throw d.error;return d});
async function upload(f){if(!f)throw'No file chosen';if(f.size>5e7)throw'File is larger than 50 MB';const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':f.type,Authorization:'Bearer '+token},body:f}),d=await r.json().catch(()=>({error:'Upload failed'}));if(!r.ok)throw d.error;return d}
const ago=s=>{const t=(Date.now()-new Date(s.replace(' ','T')+'Z'))/1000;return t<60?'now':t<3600?Math.floor(t/60)+'m':t<86400?Math.floor(t/3600)+'h':Math.floor(t/86400)+'d'};
const av=(u,c='')=>u.avatar?`<img class="av ${c}" src="${esc(u.avatar)}" alt="">`:`<span class="av ${c}">${esc((u.username||'?')[0].toUpperCase())}</span>`;
const media=(m,t,x='')=>t=='video'?`<video src="${esc(m)}" controls playsinline ${x}></video>`:`<img src="${esc(m)}" alt="">`;
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function theme(){const d=document.body.classList.toggle('dark');localStorage.d=d?1:''}if(localStorage.d)document.body.classList.add('dark');
function modal(h){$('#md').innerHTML=`<div class="mb" onclick="if(event.target==this)closeModal()"><div class="mc">${h}</div></div>`}const closeModal=()=>$('#md').innerHTML='';
addEventListener('keydown',e=>{if(e.key=='Escape'){closeModal();closeStory()}});
// ---------- posts ----------
const postCard=p=>`<article class="card"><div class="ph">${av(p,'sm')}<a href="#/u/${esc(p.username)}"><b>${esc(p.username)}</b></a><span class="m">· ${ago(p.created)}</span>${p.user_id==me.id?`<button class="ic" style="margin-left:auto" onclick="delPost(${p.id})">🗑</button>`:''}</div>
${p.type=='text'?`<div class="tp g${p.id%4}" ondblclick="dbl(${p.id},${p.liked})">${esc(p.caption)}</div>`:`<div class="pm" ondblclick="dbl(${p.id},${p.liked})">${media(p.media,p.type)}</div>`}
<div class="pa"><button class="ic" onclick="like(${p.id})">${p.liked?'❤️':'🤍'}</button><a class="ic" href="#/post/${p.id}">💬</a><button class="ic" onclick="shareSheet(${p.id})">📤</button><button class="ic" style="margin-left:auto" onclick="save(${p.id})">${p.saved?'🔖':'📑'}</button></div>
<div class="pb"><b>${p.likes} likes</b>${p.type!='text'&&p.caption?`<p style="margin:4px 0"><b>${esc(p.username)}</b> ${esc(p.caption)}</p>`:''}${p.comments?`<a class="m" href="#/post/${p.id}">View all ${p.comments} comments</a>`:''}<input class="ci" placeholder="Add a comment…" onkeydown="if(event.key=='Enter')comment(${p.id},this)"></div></article>`;
const tile=p=>`<a class="tl" href="#/post/${p.id}">${p.type=='text'?`<div class="tp g${p.id%4}" style="font-size:13px;padding:10px;height:100%">${esc(p.caption.slice(0,60))}</div>`:p.type=='video'?`<video src="${esc(p.media)}" muted></video><span class="vb">▶</span>`:`<img src="${esc(p.media)}" alt="">`}</a>`;
const like=async id=>{try{await api('/posts/'+id+'/like','POST');render(1)}catch(e){toast(e)}},dbl=(id,l)=>{if(!l)like(id)};
const save=async id=>{try{await api('/posts/'+id+'/save','POST');render(1)}catch(e){toast(e)}};
const comment=async(id,i)=>{try{await api('/posts/'+id+'/comments','POST',{text:i.value});render(1)}catch(e){toast(e)}};
const delPost=async id=>{if(confirm('Delete this post?')){await api('/posts/'+id,'DELETE');location.hash.startsWith('#/post/')?location.hash='#/':render(1)}};
const delC=async id=>{await api('/comments/'+id,'DELETE');render(1)};
const follow=async id=>{try{await api('/follow/'+id,'POST');render(1)}catch(e){toast(e)}};
async function shareSheet(id){const us=await api('/users');modal(`<h3 style="margin-top:0">Share post</h3><button class="sm" onclick="navigator.clipboard.writeText(location.origin+'/#/post/${id}').then(()=>toast('Link copied'))">🔗 Copy link</button><h4>Send to</h4><div id="sl">${shareList(us,id)}</div><input class="f" placeholder="Search people" oninput="shareSearch(this.value,${id})">`)}
const shareList=(us,id)=>us.map(u=>`<div class="ur">${av(u,'sm')}<b>${esc(u.username)}</b><button class="sm" style="margin-left:auto" onclick="sendPost('${esc(u.username)}',${id},this)">Send</button></div>`).join('')||'<p class="m">Follow people to share with them, or search above.</p>';
const shareSearch=async(t,id)=>{$('#sl').innerHTML=shareList(await api('/users?search='+encodeURIComponent(t)),id)};
const sendPost=async(un,id,b)=>{try{await api('/messages/'+un,'POST',{post_id:id});b.textContent='Sent ✓';b.disabled=true}catch(e){toast(e)}};
// ---------- stories & notes ----------
const tray=l=>`<div class="tray">${l.map((u,i)=>`<div class="tu" onclick="${u.id==me.id?'meStory()':`openStory(${i})`}">${u.note?`<div class="nb">${esc(u.note)}</div>`:''}<div class="ring ${u.stories.length?(u.allSeen?'seen':'new'):''}">${av(u)}</div><span>${u.id==me.id?'Your story':esc(u.username)}</span></div>`).join('')}</div>`;
function meStory(){const m=TR.find(u=>u.id==me.id);modal(`<h3 style="margin-top:0">Your story & note</h3>${m.stories.length?`<button class="pri w" onclick="closeModal();openStory(${TR.indexOf(m)})">View my story</button>`:''}<button class="pri w" onclick="closeModal();$('#sf').click()">Add photo or video story</button><button class="sm w" onclick="setNote()">${m.note?'Change note: '+esc(m.note):'Share a note'}</button>`)}
const setNote=()=>{const t=prompt('Share a thought (max 60 characters). Leave empty to remove:',TR.find(u=>u.id==me.id)?.note||'');if(t!==null)api('/note','PUT',{text:t}).then(()=>{closeModal();render(1)})};
async function addStory(i){try{const f=i.files[0],d=await upload(f);await api('/stories','POST',{media:d.url,type:d.type});i.value='';toast('Story shared for 24 hours');render(1)}catch(e){toast(e)}}
const openStory=(i,j=0)=>{sv={u:i,s:j};showStory()};
function showStory(){clearTimeout(sv.t);const u=TR[sv.u];if(!u||!u.stories.length)return closeStory();const st=u.stories[sv.s],vid=st.type=='video';api('/stories/'+st.id+'/view','POST').catch(()=>{});
  $('#sv').innerHTML=`<div class="svw"><div class="sb">${u.stories.map((x,k)=>`<i class="${k<sv.s?'d':''}"><b ${k==sv.s?`style="animation:fill ${vid?12:5}s linear forwards"`:''}></b></i>`).join('')}</div><div class="sh">${av(u,'sm')}<b>${esc(u.username)}</b><span>${ago(st.created)}</span><button class="ic" style="margin-left:auto;color:#fff" onclick="closeStory()">✕</button></div>${vid?`<video src="${esc(st.media)}" autoplay playsinline onended="nextStory()"></video>`:`<img src="${esc(st.media)}" alt="">`}<div class="sn" onclick="prevStory()"></div><div class="sn r" onclick="nextStory()"></div>${u.id==me.id?`<div class="sf"><button class="sm" onclick="storyViews(${st.id})">👁 Views</button> <button class="sm" onclick="delStory(${st.id})">Delete</button></div>`:''}</div>`;
  if(!vid)sv.t=setTimeout(nextStory,5000)}
function nextStory(){const u=TR[sv.u];if(sv.s<u.stories.length-1){sv.s++;return showStory()}let n=sv.u+1;while(n<TR.length&&!TR[n].stories.length)n++;n<TR.length?(sv={u:n,s:0},showStory()):closeStory()}
const prevStory=()=>{if(sv.s>0)sv.s--;showStory()};
function closeStory(){clearTimeout(sv.t);if($('#sv').innerHTML){$('#sv').innerHTML='';if(me&&(location.hash||'#/')=='#/')render(1)}}
async function storyViews(id){clearTimeout(sv.t);const v=await api('/stories/'+id+'/views');modal(`<h3 style="margin-top:0">Viewed by ${v.length}</h3>${v.map(u=>`<div class="ur">${av(u,'sm')}<b>${esc(u.username)}</b></div>`).join('')||'<p class="m">No views yet.</p>'}`)}
const delStory=async id=>{if(!confirm('Delete this story?'))return;await api('/stories/'+id,'DELETE');closeStory();render(1)};
// ---------- views ----------
async function home(v){const[tr,fd,sg]=await Promise.all([api('/stories'),api('/feed'),api('/suggestions')]);TR=tr;
  v.innerHTML=tray(tr)+(sg.length?`<div class="card sg"><b>Suggested for you</b><div class="tray">${sg.map(u=>`<div class="tu" style="padding-top:8px"><a href="#/u/${esc(u.username)}">${av(u)}</a><span>${esc(u.username)}</span><button class="sm" onclick="follow(${u.id})">Follow</button></div>`).join('')}</div></div>`:'')+(fd.map(postCard).join('')||'<div class="card c">Your feed is empty. Follow people or create your first post!</div>')}
async function profile(v,name){const u=await api('/u/'+name),own=u.id==me.id;
  v.innerHTML=`<div class="card pf">${av(u,'xl')}<div style="flex:1;min-width:200px"><h3 style="margin:0">${esc(u.username)}</h3><div class="st"><span><b>${u.posts.length}</b> posts</span><span><b>${u.followers}</b> followers</span><span><b>${u.following}</b> following</span></div><b>${esc(u.name)}</b>${u.note?` <span class="m">💭 ${esc(u.note)}</span>`:''}<p style="margin:4px 0">${esc(u.bio)}</p>
  ${own?'<a href="#/edit"><button class="sm">Edit profile</button></a> <a href="#/saved"><button class="sm">🔖 Saved</button></a>':`<button class="${u.isFollowing?'sm':'pri'}" onclick="follow(${u.id})">${u.isFollowing?'Following':'Follow'}</button> <a href="#/messages/${esc(u.username)}"><button class="sm">Message</button></a>`}</div></div>
  <div class="gr">${u.posts.map(tile).join('')}</div>${u.posts.length?'':'<div class="card c">No posts yet.</div>'}`}
async function postPage(v,id){const[p,cs]=await Promise.all([api('/posts/'+id),api('/posts/'+id+'/comments')]);
  v.innerHTML=postCard(p)+`<div class="card" style="padding:12px"><b>Comments</b>${cs.map(c=>`<div class="ur">${av(c,'sm')}<div><a href="#/u/${esc(c.username)}"><b>${esc(c.username)}</b></a> ${esc(c.text)} <span class="m">${ago(c.created)}</span></div>${c.user_id==me.id||p.user_id==me.id?`<button class="ic" style="margin-left:auto;font-size:14px" onclick="delC(${c.id})">✕</button>`:''}</div>`).join('')||'<p class="m">No comments yet.</p>'}</div>`}
async function grid(v,title,url){const l=await api(url);v.innerHTML=`<h3>${title}</h3>${l.length?`<div class="gr">${l.map(tile).join('')}</div>`:'<div class="card c">Nothing here yet.</div>'}`}
const userRow=u=>`<div class="ur">${av(u,'sm')}<a href="#/u/${esc(u.username)}"><b>${esc(u.username)}</b><br><span class="m">${esc(u.name)}</span></a><button class="${u.following?'sm':'pri'}" style="margin-left:auto" onclick="follow(${u.id})">${u.following?'Following':'Follow'}</button></div>`;
async function searchView(v){v.innerHTML=`<input class="f" id="sq" placeholder="Search people" oninput="doSearch(this.value)"><div class="card" style="padding:8px 14px;margin-top:12px" id="sr"></div>`;doSearch('')}
const doSearch=async t=>{$('#sr').innerHTML=(await api('/users?search='+encodeURIComponent(t))).map(userRow).join('')||'<p class="m">No people found.</p>'};
function createView(v){v.innerHTML=`<div class="card" style="padding:16px"><h3 style="margin-top:0">Create post</h3><input type="file" id="cf" accept="image/*,video/*" onchange="prev(this)"><div id="pv" style="margin:8px 0"></div><textarea class="f" id="cc" rows="3" maxlength="500" placeholder="Write a caption (or just text for a text post)"></textarea><p class="err" id="er"></p><button class="pri" id="cb" onclick="createPost()">Share post</button></div>`}
const prev=i=>{const f=i.files[0];$('#pv').innerHTML=f?(f.type.startsWith('video')?`<video src="${URL.createObjectURL(f)}" controls style="max-width:100%"></video>`:`<img src="${URL.createObjectURL(f)}" style="max-width:100%">`):''};
async function createPost(){const b=$('#cb');b.disabled=true;try{const f=$('#cf').files[0],d=f?await upload(f):{};await api('/posts','POST',{caption:$('#cc').value,media:d.url,type:d.type});location.hash='#/'}catch(e){$('#er').textContent=e;b.disabled=false}}
async function editView(v){const u=await api('/u/'+me.username);v.innerHTML=`<div class="card" style="padding:18px"><h3 style="margin-top:0">Edit profile</h3><div class="ur">${av(u,'xl')}<button class="sm" onclick="$('#af').click()">Change photo</button><input id="af" type="file" accept="image/*" hidden onchange="newAv(this)"></div><input class="f" id="en" value="${esc(u.name)}" placeholder="Name"><textarea class="f" id="eb" rows="3" maxlength="150" placeholder="Bio">${esc(u.bio)}</textarea><p class="err" id="er"></p><button class="pri" onclick="saveProfile()">Save</button></div>`}
async function newAv(i){try{const d=await upload(i.files[0]);await api('/me','PUT',{name:$('#en').value,bio:$('#eb').value,avatar:d.url});me=await api('/me');render(1)}catch(e){toast(e)}}
async function saveProfile(){try{await api('/me','PUT',{name:$('#en').value,bio:$('#eb').value});me=await api('/me');location.hash='#/u/'+me.username}catch(e){$('#er').textContent=e}}
async function notifs(v){const l=await api('/notifs'),T={like:'liked your post',comment:'commented on your post',follow:'started following you'};counts();
  v.innerHTML='<h3>Notifications</h3><div class="card" style="padding:8px 14px">'+(l.map(n=>`<a class="ur" href="${n.post_id?'#/post/'+n.post_id:'#/u/'+esc(n.username)}" style="${n.seen?'':'font-weight:600'}">${av(n,'sm')}<span><b>${esc(n.username)}</b> ${T[n.type]} <span class="m">${ago(n.created)}</span></span></a>`).join('')||'<p class="m">No notifications yet.</p>')+'</div>'}
// ---------- chat ----------
async function messages(v,name){cur={msgs:1,thread:name};v.innerHTML=`<div class="chat ${name?'open':''}"><div class="cl" id="cl"></div><div class="th" id="th">${name?'':'<div class="c m" style="margin:auto">Select a chat or start a new one</div>'}</div></div>`;await loadChats();if(name)await loadThread(name)}
async function loadChats(){const l=await api('/chats');if(!$('#cl'))return;$('#cl').innerHTML=`<div class="cv"><b style="font-size:16px">Chats</b><button class="sm" style="margin-left:auto" onclick="newChat()">＋ New</button></div>`+(l.map(c=>`<a class="cv ${cur.thread==c.username?'on':''}" href="#/messages/${esc(c.username)}">${av(c)}<div><b>${esc(c.username)}</b><small class="m">${c.last.from_id==me.id?'You: ':''}${c.last.post_id?'📤 Shared a post':c.last.media?'📎 Media':esc(c.last.text)}</small></div>${c.unread?`<span class="bd">${c.unread}</span>`:''}</a>`).join('')||'<p class="m" style="padding:12px">No chats yet. Tap ＋ New.</p>');counts()}
const newChat=async()=>{modal(`<h3 style="margin-top:0">New chat</h3><input class="f" placeholder="Search people" oninput="chatSearch(this.value)"><div id="cs"></div>`);chatSearch('')};
const chatSearch=async t=>{$('#cs').innerHTML=(await api('/users?search='+encodeURIComponent(t))).map(u=>`<a class="ur" href="#/messages/${esc(u.username)}" onclick="closeModal()">${av(u,'sm')}<b>${esc(u.username)}</b></a>`).join('')||'<p class="m">No people found.</p>'};
const bub=m=>`<div class="b ${m.from_id==me.id?'me':'ot'}">${m.post?`<a class="sp" href="#/post/${m.post.id}"><b>@${esc(m.post.username)}</b><br>${m.post.type=='image'?`<img src="${esc(m.post.media)}" alt="">`:m.post.type=='video'?'🎥 Video':esc(m.post.caption.slice(0,80))}</a>`:''}${m.media?media(m.media,m.mtype):''}${m.text?`<span>${esc(m.text)}</span>`:''}<small>${ago(m.created)}${m.from_id==me.id?(m.seen?' <i style="color:#34b7f1;font-style:normal">✓✓</i>':' ✓'):''}</small></div>`;
async function loadThread(name){const d=await api('/messages/'+name),th=$('#th');if(!th)return;const keep=$('#mt')?.value||'';
  th.innerHTML=`<div class="cv" style="border-bottom:1px solid var(--ln)">${av(d.user,'sm')}<a href="#/u/${esc(d.user.username)}"><b>${esc(d.user.name)}</b></a></div><div id="ml">${d.messages.map(bub).join('')||'<p class="m c">Say hi 👋</p>'}</div><div class="mi"><button class="ic" onclick="$('#mf').click()">📎</button><input type="file" id="mf" accept="image/*,video/*" hidden onchange="sendMedia('${esc(name)}',this)"><input class="f" id="mt" placeholder="Message" onkeydown="if(event.key=='Enter')sendMsg('${esc(name)}')"><button class="pri" onclick="sendMsg('${esc(name)}')">Send</button></div>`;
  $('#mt').value=keep;const ml=$('#ml');ml.scrollTop=ml.scrollHeight;counts()}
async function sendMsg(name){const i=$('#mt'),t=i.value.trim();if(!t)return;i.value='';try{await api('/messages/'+name,'POST',{text:t});await loadThread(name);loadChats();$('#mt').focus()}catch(e){toast(e)}}
async function sendMedia(name,i){try{const d=await upload(i.files[0]);await api('/messages/'+name,'POST',{media:d.url,mtype:d.type});await loadThread(name);loadChats()}catch(e){toast(e)}}
async function side(){const r=$('#rs');if(innerWidth<1100){r.innerHTML='';return}
  const[sg,ex]=await Promise.all([api('/suggestions'),api('/feed?mode=explore')]),top=[...ex].sort((a,b)=>b.likes-a.likes).slice(0,6);
  r.innerHTML=`<div class="ur" style="padding:0 0 12px"><a href="#/u/${esc(me.username)}">${av(me)}</a><a href="#/u/${esc(me.username)}"><b>${esc(me.username)}</b><br><span class="m">${esc(me.name)}</span></a></div><div class="card" style="padding:12px"><b>Suggested for you</b>${sg.slice(0,5).map(u=>`<div class="ur">${av(u,'sm')}<a href="#/u/${esc(u.username)}"><b>${esc(u.username)}</b><br><span class="m">${esc(u.name)}</span></a><button class="sm" style="margin-left:auto" onclick="follow(${u.id})">Follow</button></div>`).join('')||'<p class="m">You follow everyone 🎉</p>'}</div><div class="card" style="padding:12px"><b>Trending now 🔥</b><div class="gr" style="margin-top:8px">${top.map(tile).join('')}</div></div><p class="m" style="font-size:12px">© 2026 Vibe · CodeAlpha project</p>`}
// ---------- app shell ----------
async function counts(){if(!me)return;try{const c=await api('/counts');$('#bm').textContent=c.messages||'';$('#bn').textContent=c.notifs||''}catch{}}
function connect(){if(es)es.close();es=new EventSource('/api/stream?t='+token);
  es.addEventListener('msg',()=>{counts();if(cur.msgs){loadChats();cur.thread&&loadThread(cur.thread)}else toast('New message')});
  es.addEventListener('read',()=>{cur.thread&&loadThread(cur.thread)});es.addEventListener('feed',()=>{if((location.hash||'#/')=='#/'&&!document.activeElement?.matches('input,textarea'))render(1);else toast('New posts from people you follow')});es.addEventListener('notif',()=>{counts();if(!cur.msgs)toast('New notification')})}
async function boot(){me=await api('/me');$('#np').href='#/u/'+me.username;connect();counts()}
async function authGo(su){try{const d=await api(su?'/register':'/login','POST',{username:$('#un').value.trim(),name:su?$('#n').value:'',password:$('#pw').value});token=localStorage.t=d.token;await boot();location.hash='#/';render()}catch(e){$('#er').textContent=e}}
function logout(){if(es)es.close();token='';me=null;localStorage.removeItem('t');location.hash='#/login';render()}
const loginView=()=>{const su=location.hash=='#/signup';return `<div class="card" style="max-width:360px;margin:60px auto;padding:30px;text-align:center"><div class="logo" style="padding:0 0 18px;font-size:40px">Vibe</div>${su?'<input class="f" id="n" placeholder="Full name">':''}<input class="f" id="un" placeholder="Username" autocapitalize="off"><input class="f" id="pw" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')authGo(${su})"><p class="err" id="er"></p><button class="pri w" onclick="authGo(${su})">${su?'Sign up':'Log in'}</button><p>${su?'Have an account? <a href="#/login" style="color:var(--pri)">Log in</a>':'New here? <a href="#/signup" style="color:var(--pri)">Sign up</a>'}</p><p class="m" style="font-size:12px">Demo users: maria, arjun, priya, rahul · password demo123</p></div>`};
async function render(keep){
  const h=location.hash.slice(1)||'/',v=$('#v'),p=h.split('/');cur={};$('#wrap').classList.toggle('wide',p[1]=='messages');$('#nav').style.display=me?'':'none';document.body.style.paddingLeft=me?'':'0';
  if(!me){v.innerHTML=loginView();$('#rs').innerHTML='';return}
  if(!keep)scrollTo(0,0);document.querySelectorAll('#nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r=='/'?h=='/':h.startsWith(a.dataset.r)));
  try{
    if(h=='/')await home(v);else if(p[1]=='u')await profile(v,p[2]);else if(p[1]=='post')await postPage(v,p[2]);else if(h=='/explore')await grid(v,'Explore','/feed?mode=explore');
    else if(h=='/saved')await grid(v,'Saved posts','/saved');else if(h=='/search')await searchView(v);else if(h=='/create')createView(v);else if(h=='/edit')await editView(v);
    else if(h=='/notifications')await notifs(v);else if(p[1]=='messages')await messages(v,p[2]||'');else{location.hash='#/'}
    if(p[1]!='messages')side().catch(()=>{});
  }catch(e){if(e=='Please log in')return logout();v.innerHTML=`<div class="card c err">${esc(e)}</div>`}
}
addEventListener('hashchange',()=>render());
(async()=>{if(token)try{await boot()}catch{token='';localStorage.removeItem('t')}render()})();
</script></html>
